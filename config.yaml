# Configuración del pipeline. Todo lo que se toca sin editar código vive acá.

project:
  name: tp-premier-ml
  # Target del TP. Los goles se guardan igual en Gold, así que cambiar a "poisson"
  # no obliga a rehacer la capa de features.
  target: "1x2"

seasons:
  # Ventana de datos a INGESTAR (bronze). Formato vaastav: "YYYY-YY".
  # xG/xA/xGC en FPL sólo existen desde 2022-23 — por eso el corte.
  ingest_from: "2022-23"
  current: "2026-27"

  # Ventana de ENTRENAMIENTO. Se puede achicar sin volver a bajar nada.
  # Si el EDA muestra que 1.520 partidos son pocos, bajar `train_from` implica
  # re-ingestar (y perder xG en las temporadas viejas).
  train_from: "2022-23"
  # Temporada reservada para test temporal. Nunca entra al entrenamiento.
  holdout: "2025-26"

sources:
  fpl_api:
    base_url: "https://fantasy.premierleague.com/api"
    # La API rechaza requests sin User-Agent de browser.
    user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
    timeout_s: 30
    max_retries: 4
    backoff_base_s: 1.5
    # Pausa entre llamadas. La API no publica rate limit; somos conservadores.
    sleep_between_calls_s: 0.5

  vaastav:
    base_url: "https://raw.githubusercontent.com/vaastav/Fantasy-Premier-League/master/data"
    timeout_s: 120
    # Archivos por temporada. `gws/merged_gw.csv` no existe hasta que se juega la GW1
    # de esa temporada — su ausencia es estado normal, no error.
    season_files:
      - "gws/merged_gw.csv"
      - "teams.csv"
      - "players_raw.csv"
      - "fixtures.csv"
    global_files:
      - "master_team_list.csv"

  football_data:
    # Formato de temporada distinto: 2022-23 -> "2223".
    base_url: "https://www.football-data.co.uk/mmz4281"
    division: "E0" # E0 = Premier League
    timeout_s: 60
    # Guard crítico: el URL de una temporada que todavía no arrancó redirige (301)
    # a otra división. Sin esta validación entran datos de National League en silencio.
    validate_division: true

    # --- Historia profunda: SOLO para sembrar los ratings (Fase 1) ---
    #
    # NO entra al entrenamiento. Un partido de 2005 no tiene xG ni datos de FPL, y el
    # futbol de entonces no predice el de hoy: usarlo como fila de train seria un error.
    # Lo que si aporta es lo que un rating necesita y hoy no tiene:
    #
    #   1. BURN-IN. Hoy el Elo arranca a todos en 1500 en 2022-23 y tarda media temporada
    #      en converger: la primera temporada de train usa una feature que todavia no
    #      significa nada.
    #   2. LOS ASCENDIDOS. Con E1/E2 un equipo que sube entra con el rating que se gano en
    #      el Championship, en vez de 1500 mas el parche de `features/cold_start.py`. Es el
    #      fallo medido en la GW1 de 2026-27 (HUL-MUN, IPS-SUN).
    #
    # Las divisiones NO se calibran con un offset a mano: el Elo es global y la separacion
    # entre divisiones EMERGE de ascensos y descensos, que son los unicos eventos que
    # conectan los grupos. Por eso hace falta profundidad: se mueven 3+3 equipos por año.
    historia:
      desde: "2000-01"
      divisiones: ["E0", "E1", "E2"]

storage:
  # "local" hoy; "gcs" / "bigquery" cuando haya proyecto GCP.
  # La lógica de negocio no cambia: todo el I/O pasa por common/storage.py.
  backend: "local"
  root: "data"
  bronze_dir: "bronze"
  silver_dir: "silver"
  gold_dir: "gold"
  format: "parquet"

  gcp:
    project_id: null
    region: "southamerica-east1"
    bucket: null
    bq_dataset: null

features:
  # Ventanas rolling sobre fechas ANTERIORES. Nunca la fecha a predecir.
  # Van sobre los ULTIMOS N PARTIDOS de cada equipo, no sobre las ultimas N gameweeks:
  # en 2022-23 la GW7 no existe y hay fechas con 7 partidos y otras con 16.
  rolling_windows: [3, 5]

  # El xG de FPL viene HARDCODEADO EN CERO en 2022-23 hasta esta gameweek (medido: los
  # 20 equipos en 0,0 en las GW 1-6 y 8-15; desde la 16, ninguno). No es dato faltante
  # disfrazado de cero: hay que enmascararlo a NaN o el modelo aprende un artefacto de
  # calendario. La flag `xg_available` lo deja explicito para el modelo.
  xg_min_gameweek:
    "2022-23": 16

  # Corte temporal: toda feature usa solo partidos TERMINADOS antes de este momento.
  # El ancla es el inicio de la fecha -- min(kickoff) de la gameweek -- asi todos los
  # partidos de una misma fecha se predicen con la misma informacion. Es el criterio mas
  # conservador y el que hace que las dobles fechas (85 casos) no filtren.
  corte: "inicio_de_fecha"

  # ¿Entran las interacciones de matchup (Fase 4)?
  #
  # Siete cruces elegidos por teoria sobre las features de Opta: lo que genera un equipo
  # contra lo que permite el otro. No es lo mismo que `dif_X`, que resta LA MISMA columna
  # de los dos lados. Ver `features/estilos.py`.
  #
  # **Apagado por el criterio pre-registrado, y es el caso mas cerrado de las cuatro fases.**
  # Banco A delta RPS +0,0003 +-0,0011 (cruza el cero) y Banco B +0,0002: la metrica
  # primaria no se despega del ruido. Pero la accuracy mejora en las TRES semillas del
  # Banco B (+0,0079 de media) y el subgrupo `resto` --donde vive la hipotesis del choque de
  # estilos-- sube de 0,4958 a 0,5025. Si la metrica primaria hubiera sido accuracy, la
  # conclusion podria haber sido otra: por eso se fija antes de correr.
  estilos_activo: false

  # ¿Entran las features de valor de plantel (Transfermarkt)? Fase 5.
  #
  # Es la unica fuente del proyecto con informacion DE AFUERA: todo lo demas se calcula con
  # resultados pasados de Premier, que es justo lo que un ascendido no tiene.
  #     python -m ingestion.bronze_transfermarkt && python -m transform.valores
  #
  # **Apagado por medicion**, como las otras dos fases. Banco A delta RPS +0,0003 +-0,0010
  # (cruza el cero) y accuracy -0,0074; los tres subgrupos empeoran. El diagnostico esta en
  # `training/README.md`: las features SI se usan -- 8,4% de la ganancia, `dif_valor_top11`
  # sexta de 274 -- pero correlacionan 0,729 con `dif_elo`. Miden lo mismo que el rating
  # desde otro angulo, y con 1.004 filas de train una vista correlacionada no agrega.
  valores_activo: false

  # ¿Entran los pi-ratings al feature set?
  #
  # **Apagado por medicion, igual que el sembrado del Elo.** La Fase 2 los construyo y los
  # midio con el protocolo de docs/PLAN-MEJORAS.md: Banco A delta RPS +0,0002 +-0,0013
  # (cruza el cero), Banco B +0,0006, y el subgrupo de ascendidos empeora. El diagnostico
  # que lo cierra esta en `training/README.md`: la ventaja de localia POR EQUIPO no
  # persiste (r=0,093 entre mitades de los datos), asi que la premisa de la fase es falsa.
  #
  # El codigo, los tests y el ajuste quedan: `python -m features.pi_ratings --ajustar`.
  pi_ratings_activo: false

  # --- pi-ratings (Fase 2): un rating de LOCAL y otro de VISITANTE por equipo ---
  #
  # Constantinou & Fenton (2013). Arregla dos cosas que el Elo de este proyecto no puede:
  # la ventaja de localia deja de ser la constante `VENTAJA_LOCAL = 65` igual para los
  # veinte equipos, y el aprendizaje pasa a ser sobre la DIFERENCIA DE GOLES en vez del
  # resultado. `gamma` es cuanto de lo aprendido de local se transfiere al rating de
  # visitante: con gamma=1 los dos ratings colapsan a uno solo y el sistema vuelve a ser
  # un Elo.
  #
  # Los dos salen de `python -m features.pi_ratings --ajustar`, que barre una grilla chica
  # y elige por error de goles SOLO sobre las temporadas de train. Al Banco A llega una
  # sola configuracion: el holdout decide si la fase entra, no cual de sus variantes.
  # Ajustados sobre las temporadas de train (MAE 1,3839 goles contra 1,4833 de la vara
  # trivial de predecir siempre 0). El optimo es INTERIOR a la grilla: la primera version
  # llegaba solo hasta 0,10/0,7 y caia justo en la esquina.
  pi_lambda: 0.20
  pi_gamma: 0.70

  # ¿El Elo se siembra con la historia profunda de football-data (E0/E1/E2 desde 2000-01)?
  #
  # **Apagado, y no por defecto: por medicion.** La Fase 1 lo construyo, lo midio con el
  # protocolo de docs/PLAN-MEJORAS.md y NO paso. Detalle en `training/README.md` y en
  # `models/xgb_gbt/attempts.jsonl`; el resumen es que el Elo sembrado resulta PEOR como
  # predictor por si solo, y peor justo en los ascendidos (AUC local 0,696 -> 0,662), que
  # eran la razon de ser de la fase.
  #
  # La capacidad queda: la ingesta, `fact_match_historico` y el sembrado siguen ahi, y la
  # Fase 2 (pi-ratings) los necesita. Lo que no queda es prendido, porque el Gold vigente
  # tiene que ser el mismo con el que se entreno el modelo que sirve.
  #
  #     python -m ingestion.bronze_fd_historia && python -m transform.historia
  #     # poner en true, reconstruir Gold con TP_VERSION_LABEL, y medir con:
  #     python -m training.comparar_gold --banco-b
  elo_sembrado_con_historia: false

  # Cuantas features conserva el set `podado`, elegidas por importancia de ganancia
  # sobre el resultado del set `completo`. No se eligen a mano.
  podado_top_n: 40
  # Columnas prohibidas por riesgo de leakage. Los tests fallan si aparecen en Gold.
  banned_columns:
    # `xP` se scrapea del campo `ep_this` DESPUÉS de que termina la fecha; el propio
    # repo de vaastav advierte que puede reflejar información post-partido.
    - "xP"
    # Resultado del partido a predecir y todo lo que se deriva de él.
    - "team_h_score"
    - "team_a_score"
    - "total_points"
    - "bps"
    - "bonus"

logging:
  level: "INFO"
  format: "%(asctime)s | %(levelname)-7s | %(name)-22s | %(message)s"

training:
  # --- El modelo de produccion ---
  # Elegido midiendo, no por gusto. Gana en accuracy (0,5160) y F1 macro (0,4205) en el
  # walk-forward de 38 fechas, y coincide con el holdout (0,5132). Le gana a "siempre
  # local" en el 60,5% de las fechas, contra 52,6% de los demas candidatos.
  # La grilla completa esta en training/output/comparacion_completa.csv.
  modelo: "xgb_gbt"

  # Que filas se usan como OBJETIVO de entrenamiento. Las excluidas se conservan igual
  # como HISTORIA para las ventanas de los partidos posteriores: las features de Gold ya
  # estan calculadas sobre la secuencia completa.
  #   "todo"          las 1.140
  #   "sin_xg_falso"  saca las fechas de 2022-23 donde el xG viene hardcodeado en cero
  #                   (1.004 filas). Mejora 5 de 7 modelos.
  #   "sin_2022_23"   saca la temporada entera (760). Mejoraba con el feature set viejo,
  #                   pero al agregar Elo la ventaja se diluye y rompe a los lineales.
  datos_entrenamiento: "sin_xg_falso"

  # ¿El modelo de PRODUCCION incluye el holdout en el entrenamiento?
  #
  # El holdout 2025-26 se reservó para ELEGIR: modelo, features e hiperparámetros. Esa
  # función ya la cumplió. Mantenerlo afuera para siempre desperdicia 380 partidos, y
  # ademas son los MAS RECIENTES -- los mas parecidos a lo que viene. Con 1.004 filas de
  # train, sumar 380 es un 38% mas de datos.
  #
  # La disciplina que hay que mantener: una vez que el modelo de produccion vio 2025-26,
  # **sus numeros sobre 2025-26 dejan de ser evidencia de generalizacion**. Por eso
  # conviven dos modelos:
  #
  #   evaluacion  entrena hasta 2024-25, se mide en 2025-26. Es el que se REPORTA, y el
  #               que justifica cada decision de disenio. Reproducible con
  #               `python -m training.run --sin-holdout`.
  #   produccion  entrena hasta 2025-26 inclusive. Es el que SIRVE. Su unico test honesto
  #               es la temporada en curso, fecha a fecha.
  incluir_holdout: true

  # "auto" prueba CUDA y cae a CPU si falla; "cuda" explicito LEVANTA si no hay GPU
  # (explicito es explicito); "cpu" fuerza CPU. Pisable con la variable TP_DEVICE.
  device: "auto"

  # Temporada reservada para early stopping. Sale del train, NUNCA es el holdout:
  # usar el holdout para decidir cuando parar es la forma sutil de contaminarlo.
  valid_season: "2024-25"

  # Semillas que se promedian. Cada fit tarda menos de un segundo y con 380 partidos de
  # holdout el error estandar ronda +-5 puntos: promediar es reduccion de varianza gratis.
  n_seeds: 5
  seed: 42

  # --- La regla de decision: de las tres probabilidades a UNA clase ---
  #
  # No es un hiperparametro del modelo. Los boosters son los mismos y las probabilidades
  # son identicas al bit: cambia solo la funcion que va de P a la etiqueta. Por eso un
  # candidato aca no necesita ni reentreno ni un .ubj propio, y la comparacion contra
  # produccion es pareada sobre los mismos partidos (McNemar, ver `promocion`).
  #
  # La implementacion, con la tabla del holdout y las advertencias, esta en
  # `serving/decision.py`.
  decision:
    produccion:
      regla: "argmax"
      motivo: "la clase mas probable; es lo que el sistema anuncia"

    # Corren EN PARALELO: se registran en cada prediccion y se miden fecha a fecha,
    # pero no cambian lo que el sistema anuncia hasta que el test los respalde.
    candidatos:
      - nombre: "umbral_empate_030"
        regla: "umbral_empate"
        umbral: 0.30
        # Desde donde la medicion es PROSPECTIVA. Las fechas anteriores se etiquetan
        # igual (la regla es funcion pura de las probabilidades guardadas) pero no
        # cuentan como evidencia: la regla se eligio el 2026-09-01, con las fechas 1 y 2
        # ya jugadas y la 3 todavia sin empezar.
        desde: "2026-27 GW3"
        motivo: >-
          En el holdout de 380 partidos pasa de 4 empates predichos a 36 con precision
          0,417. La accuracy NO mejora de forma demostrable: medido en
          `training/decision_eval.py`, el delta va de -0,005 a +0,026 segun la semilla,
          con McNemar entre p=0,08 y p=1,00 -- mas chico que el ruido. El AUC del empate
          es 0,515 [0,441-0,584]: el umbral cambia CUANTOS empates se anuncian, no CUALES.
          Corre en paralelo igual porque es la palanca de NEGOCIO correcta (costo de
          perderse un empate contra costo de anunciar uno que no fue) y porque la
          temporada en curso es la unica muestra que todavia no se miro.

  promocion:
    # Fechas de la ventana rodante sobre la que se compara candidato vs produccion.
    # Con una sola fecha (10 partidos) el error estandar de la accuracy es +-15,7 puntos:
    # promover ahi seria tirar una moneda.
    ventana_fechas: 10
    # Test de McNemar pareado: como ambos modelos predicen los MISMOS partidos, solo
    # cuentan aquellos donde discrepan. Mucho mas potente que comparar dos accuracies.
    alpha: 0.05

  apuestas:
    # Se apuesta solo si el valor esperado supera este umbral.
    # EV = p * (cuota - 1) - (1 - p)
    umbral_ev: 0.05
    stake: "plano"
